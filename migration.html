<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常之间 · 数据迁移</title><style>body{font-family:system-ui,'Microsoft YaHei',sans-serif;background:#f8f7f3;color:#2d4532;max-width:560px;margin:12vh auto;padding:24px}main{background:white;border:1px solid #e5ece4;border-radius:18px;padding:30px}h1{font-size:23px}p{font-size:13px;line-height:1.7;color:#697c6c}button{border:0;border-radius:10px;background:#426653;color:#fff;padding:12px 17px;font:600 13px system-ui;cursor:pointer}small{display:block;margin-top:18px;color:#a57b5a;line-height:1.6}</style></head><body><main><h1>导出此浏览器中的平台数据</h1><p>此页面只读取当前浏览器保存的工作台和学习记录，生成一个 JSON 文件供新私有服务器导入。文件包含你的个人记录，请妥善保存。</p><button id="download">下载迁移文件</button><small id="status"></small></main><script>document.querySelector('#download').onclick=()=>{try{const keys=['daily-space-records-v1','daily-space-learning-v1'],data={};for(const k of keys){const raw=localStorage.getItem(k);if(raw)data[k]=JSON.parse(raw)}if(!Object.keys(data).length){document.querySelector('#status').textContent='当前浏览器没有需要迁移的记录。请在原来使用平台的同一浏览器中打开此页面。';return}const blob=new Blob([JSON.stringify({format:'personal-os-export-v1',exportedAt:new Date().toISOString(),data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='personal-os-migration-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.querySelector('#status').textContent='下载完成。导入新平台后，请核对记录数量。'}catch(e){document.querySelector('#status').textContent='导出失败：'+e.message}};</script></body></html>
